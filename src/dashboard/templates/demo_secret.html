<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>スロ極</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Roboto+Mono:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css?v=70" />
    <link rel="stylesheet" href="/static/demo-secret.css?v=9" />
  </head>
  <body class="demo-page">
    <header class="top">
      <div class="brand">
        <p class="brand-kicker">PREMIUM SLOT INTELLIGENCE</p>
        <h1><span class="brand-jp">スロ極</span><span class="brand-en">- SURO-GOKU -</span></h1>
      </div>
      <div class="top-actions">
        <div class="status-cluster">
          <p class="live-badge">LIVE 監視中</p>
          <p class="time-badge">2026-10-17 16:30</p>
        </div>
      </div>
      <nav class="main-tabs" role="tablist" aria-label="分析モード">
        <button type="button" class="main-tab" role="tab" id="tab-digits" data-mode="digits" aria-selected="false">末尾分析</button>
        <button type="button" class="main-tab" role="tab" id="tab-lineups" data-mode="lineups" aria-selected="false">並び分析</button>
        <button type="button" class="main-tab is-active" role="tab" id="tab-all" data-mode="all" aria-selected="true">全台系分析</button>
        <button type="button" class="main-tab" role="tab" id="tab-joint" data-mode="joint" aria-selected="false">合同機種分析</button>
      </nav>
    </header>

    <p id="mode-lead" class="demo-lead"></p>
    <section class="stats" id="mode-stats" aria-label="集計"></section>

    <div id="view-digits" class="view hidden">
      <div class="toolbar">
        <div id="digit-halls" class="filters group-filters" role="tablist" aria-label="ホール"></div>
      </div>
      <section class="panel panel-hall-digits">
        <div class="panel-head">
          <h2 id="digit-title">末尾分析</h2>
          <p id="digit-caption" class="hint"></p>
        </div>
        <div id="digit-board" class="hall-digit-grid"></div>
      </section>
    </div>

    <div id="view-lineups" class="view hidden">
      <div class="toolbar">
        <div id="lineup-halls" class="filters group-filters" role="tablist" aria-label="店舗"></div>
        <button type="button" id="lineup-react" class="primary joint-pick">並び反応</button>
      </div>
      <p id="lineup-pending" class="hint demo-pending"></p>
      <div id="lineup-list" aria-live="polite"></div>
    </div>

    <div id="view-all" class="view">
      <div class="toolbar">
        <div id="all-halls" class="filters group-filters" role="tablist" aria-label="ホール"></div>
      </div>
      <div id="all-list"></div>
    </div>

    <div id="view-joint" class="view hidden">
      <div class="toolbar">
        <div id="joint-groups" class="filters group-filters" role="tablist" aria-label="系列グループ"></div>
        <button type="button" id="joint-pick" class="primary joint-pick">共通合同機種を洗い出す</button>
      </div>
      <p id="joint-pending" class="hint demo-pending hidden"></p>
      <div id="joint-result" aria-live="polite"></div>
    </div>

    <script id="demo-data" type="application/json">__DEMO_DATA__</script>
    <script src="/static/demo-secret.js?v=12"></script>
  </body>
</html>
