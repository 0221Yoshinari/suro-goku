<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>特定商取引法に基づく表記｜スロ極</title>
    <style>
      body { margin: 0; background: #07070b; color: #f6f1e6; font-family: "Hiragino Sans", sans-serif; line-height: 1.8; font-size: 16px; }
      main { width: min(800px, calc(100% - 40px)); margin: 48px auto 80px; }
      a { color: #d4af69; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border-bottom: 1px solid rgba(212,175,105,0.18); padding: 12px 8px; text-align: left; vertical-align: top; }
      th { color: #f0d9a0; width: 34%; font-weight: 600; }
      td { color: #cfc6b4; }
      @media (max-width: 640px) {
        th, td { display: block; width: auto; }
        th { border-bottom: 0; padding-bottom: 0; }
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="/lp">ランディングページへ戻る</a></p>
      <h1>特定商取引法に基づく表記</h1>
      <table>
        <tr><th>販売価格</th><td>月額 15,000円（税込）</td></tr>
        <tr><th>商品代金以外の必要料金</th><td>インターネット接続料など、お客様側の通信費</td></tr>
        <tr><th>支払方法</th><td>Stripe の決済画面</td></tr>
        <tr><th>支払時期</th><td>申込時に決済画面で確定した各課金日</td></tr>
        <tr><th>サービス提供時期</th><td>決済完了後、利用開始の案内が届いた時点</td></tr>
        <tr><th>返品・キャンセル</th><td>デジタルサービスの性質上、提供開始後の返品はできません。解約後の日割り返金は原則行いません（法令上必要な場合を除く）。</td></tr>
        <tr><th>動作環境</th><td>最新の主要ブラウザ（スマートフォン／PC）</td></tr>
      </table>
    </main>
  </body>
</html>
