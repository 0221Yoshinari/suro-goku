services:
  - type: web
    name: suro-goku
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn src.dashboard.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TUNNEL_ENABLED
        value: "0"
      - key: X_MONITOR_DISABLE
        value: "1"
      - key: STRIPE_CHECKOUT_URL
        value: https://buy.stripe.com/00w14p0nB2QY6MB8Qedby00
      - key: DASHBOARD_URL
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        sync: false
      - key: MASTER_PANEL_TOKEN
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SELLER_NAME
        sync: false
      - key: SELLER_ADDRESS
        sync: false
      - key: SELLER_EMAIL
        sync: false
      - key: SELLER_TEL
        sync: false
  - type: web
    name: suro-goku-billing
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SQUARE_ENVIRONMENT
        value: sandbox
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: SQUARE_APPLICATION_ID
        sync: false
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: MASTER_PANEL_TOKEN
        sync: false
      - key: MEMBER_ADMIN_OPEN
        value: "1"
      - key: SQUARE_WEBHOOK_SIGNATURE_KEY
        sync: false
      - key: SQUARE_WEBHOOK_NOTIFICATION_URL
        sync: false
