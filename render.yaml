# 請求（suro-goku-billing）とツール（suro-goku）には、同じ Postgres の DATABASE_URL を入れる。
# DATABASE_URL が postgres のときは、SQUARE_MEMBER_DB よりそちらを会員台帳に使う。
services:
  - type: web
    name: suro-goku
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn src.dashboard.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TUNNEL_ENABLED
        value: "0"
      - key: X_MONITOR_DISABLE
        value: "1"
      # 使い終わったメモリを OS に返す。返さないと無料枠の 512MB で再起動する。
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: DASHBOARD_URL
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        sync: false
      - key: MASTER_PANEL_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SQUARE_MEMBER_DB
        sync: false
      - key: LINE_ACCESS_GUARD
        sync: false
      - key: LINE_LIFF_ID
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID
        sync: false
      - key: LINE_LOGIN_CHANNEL_SECRET
        sync: false
      - key: LINE_LOGIN_REDIRECT_URL
        sync: false
      - key: LINE_OFFICIAL_URL
        value: https://lin.ee/7XxLBBy
      - key: SELLER_NAME
        sync: false
      - key: SELLER_ADDRESS
        sync: false
      - key: SELLER_EMAIL
        sync: false
      - key: SELLER_TEL
        sync: false
  - type: web
    name: suro-goku-billing
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SQUARE_ENVIRONMENT
        value: sandbox
      - key: PUBLIC_BASE_URL
        value: https://suro-goku-billing.onrender.com
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: SQUARE_APPLICATION_ID
        sync: false
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: MASTER_PANEL_TOKEN
        sync: false
      - key: MEMBER_ADMIN_OPEN
        value: "1"
      - key: MEMBER_LEDGER_SOURCE
        value: local
      - key: SQUARE_WEBHOOK_SIGNATURE_KEY
        sync: false
      - key: SQUARE_WEBHOOK_NOTIFICATION_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SQUARE_MEMBER_DB
        sync: false
